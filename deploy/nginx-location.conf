# Put inside an existing HTTPS server { } block. Own Basic Auth, independent of the server's.
# Create the user file:  printf 'bus:%s\n' "$(openssl passwd -apr1 'PASSWORD')" > /etc/nginx/bus30.htpasswd
location = /bus30 { return 301 $scheme://$http_host/bus30/; }
location /bus30/ {
    auth_basic "Bus 30";
    auth_basic_user_file /etc/nginx/bus30.htpasswd;
    proxy_pass http://127.0.0.1:8093/;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
}
